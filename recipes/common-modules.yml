# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared modules used by BOTH the NVIDIA and non-NVIDIA images.
# Edit this file to change apps on all your laptops at once.
modules:
  # Native RPM packages
  - type: dnf
    repos:
      files:
        - antigravity.repo # from files/dnf/antigravity.repo
        - claude-code.repo
      copr:
        - rivenirvana/morewaita-icon-theme # official MoreWaita COPR
        - errornointernet/quickshell
    install:
      packages:
        - antigravity
        - claude-code
        - gnome-tweaks
        - morewaita-icon-theme
        - plymouth-plugin-script
        - niri
        - xwayland-satellite
        - quickshell
        - fuzzel # app launcher in niri (Mod+D)

  # After dnf, so our files (e.g. the fuzzel theme) win over files that packages ship.
  # Includes the Gravity shell (/usr/share/gravity-shell) and niri config (/etc/niri).
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  # Miku Plymouth boot animation (from files/scripts/)
  - type: script
    scripts:
      - install-miku-plymouth.sh

  # GNOME extensions from extensions.gnome.org (by ID)
  - type: gnome-extensions
    install:
      - 4222 # Hot Edge

  # Default settings: MoreWaita icons + Hot Edge enabled
  - type: gschema-overrides
    include:
      - zz1-custom.gschema.override

  # Flatpaks (installed on first boot, kept up to date)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.valvesoftware.Steam
          - app.zen_browser.zen
          - dev.vencord.Vesktop
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal

  - type: signing # sets up container signing so you can rebase to the signed image

  # Rebuild initramfs so the Plymouth theme is included at boot (keep this last)
  - type: initramfs
