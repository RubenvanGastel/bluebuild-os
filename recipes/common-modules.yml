# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared modules used by BOTH the NVIDIA and non-NVIDIA images.
# Edit this file to change apps on all your laptops at once.
modules:
  # Native RPM packages
  - type: dnf
    repos:
      copr:
        - rivenirvana/morewaita-icon-theme # official MoreWaita COPR
        - errornointernet/quickshell
        - scottames/ghostty
    install:
      packages:
        - morewaita-icon-theme
        - plymouth-plugin-script
        - niri
        - xwayland-satellite
        - quickshell
        - matugen # wallpaper colours for the Gravity shell (Config "colors": "wallpaper")
        - qt6-qtimageformats # lets Quickshell show .webp/.tiff wallpapers
        - qt6-qtmultimedia # video wallpapers in the Gravity shell (frames are taken with ffmpeg)
        - brightnessctl # brightness keys in niri
        - playerctl # media keys in niri
        - fuzzel # app launcher in niri (Mod+D)
        - eza # modern ls with icons (aliased in /etc/profile.d/eza.sh and /etc/fish/conf.d/eza.fish)
        - fastfetch # system info in the terminal
        - fish # shell with autosuggestions and syntax highlighting built in
        - ghostty # terminal (cursor shaders set in /etc/ghostty/config)
    remove:
      packages:
        # System monitors from the base image; replaced by the Resources flatpak
        - htop
        - nvtop
        - gnome-system-monitor
        # Replaced by the Bazaar flatpak (app store used by Bluefin/Aurora/Bazzite)
        - gnome-software
        - gnome-tour # first-login welcome tour
        - yelp # GNOME Help

  # niri pulls these in as recommended packages, but Gravity (Quickshell) is the
  # bar and lock screen and Mod+T opens Ghostty. Separate step so it runs after the install above.
  - type: dnf
    remove:
      packages:
        - alacritty
        - waybar
        - swaylock

  # Nerd Font icon glyphs for eza; terminals fall back to it automatically,
  # so no need to change the terminal font
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      # Material 3 Expressive typeface used by the Gravity shell
      google-fonts:
        - Google Sans Flex

  # After dnf, so our files (e.g. the fuzzel theme) win over files that packages ship.
  # Includes the Gravity shell (/usr/share/gravity-shell), niri config (/etc/niri)
  # and Ghostty defaults (/etc/ghostty, cursor shaders in /usr/share/ghostty-cursor-shaders).
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  # Miku Plymouth boot animation (from files/scripts/)
  - type: script
    scripts:
      - install-miku-plymouth.sh
      - rebuild-font-cache.sh # makes the Nerd Font visible (stale cache otherwise)

  # GNOME extensions from extensions.gnome.org (by name)
  - type: gnome-extensions
    install:
      - Hot Edge
      - AppIndicator and KStatusNotifierItem Support # tray icons (Steam, Vesktop, ...)
      - Alphabetical App Grid # keeps the app grid sorted A-Z

  # Default settings: MoreWaita icons, extensions enabled, Compose on Right Alt
  # (system-wide extensions are installed disabled; enabling them here is required)
  - type: gschema-overrides
    include:
      - zz1-custom.gschema.override

  # Flatpaks (installed on first boot, kept up to date)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.valvesoftware.Steam
          - app.zen_browser.zen
          - dev.vencord.Vesktop
          - com.github.tchx84.Flatseal
          - net.nokyan.Resources # GNOME Circle system monitor (replaces System Monitor, htop, nvtop)
          - it.mijorus.gearlever # manage AppImages (adds them to the app grid, updates them)
          - com.ranfdev.DistroShelf # GUI for distrobox containers (distrobox ships in the base image)
          - io.github.kolunmi.Bazaar # Flathub app store (replaces GNOME Software)
          - page.tesk.Refine # advanced GNOME settings (replaces GNOME Tweaks)
          - com.usebottles.bottles # run Windows apps via Wine prefixes
          # Basic apps (the base image ships no GNOME apps as flatpaks)
          - org.gnome.Loupe # image viewer
          - org.gnome.Papers # PDF/document viewer
          - org.gnome.TextEditor
          - org.gnome.Calculator
          - io.github.diegopvlk.Cine # video player (built on mpv)

  - type: signing # sets up container signing so you can rebase to the signed image

  # Rebuild initramfs so the Plymouth theme is included at boot (keep this last)
  - type: initramfs
