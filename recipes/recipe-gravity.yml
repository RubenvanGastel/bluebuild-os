# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# niri + the Gravity shell, no GNOME, for laptops WITHOUT NVIDIA (Intel / AMD graphics)
# Published to ghcr.io/rubenvangastel/gravity
name: gravity
description: My niri + Gravity shell image (Intel/AMD graphics)

# Universal Blue's image without a desktop environment
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - from-file: niri-base-modules.yml
  - from-file: gravity-modules.yml
  - from-file: shared-modules.yml # keep last: ends with signing and the initramfs
