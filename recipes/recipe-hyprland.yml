# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Hyprland + the Caelestia shell, no GNOME, for laptops WITHOUT NVIDIA (Intel / AMD graphics)
# Published to ghcr.io/rubenvangastel/hyprland
name: hyprland
description: My Hyprland + Caelestia shell image (Intel/AMD graphics)

# Universal Blue's image without a desktop environment
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - from-file: hyprland-modules.yml
  - from-file: shared-modules.yml # keep last: ends with signing and the initramfs
