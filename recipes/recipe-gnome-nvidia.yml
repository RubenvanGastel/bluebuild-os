# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# GNOME, for laptops WITH NVIDIA graphics (incl. hybrid Intel/AMD + NVIDIA)
# Published to ghcr.io/rubenvangastel/gnome-nvidia
name: gnome-nvidia
description: My GNOME image (NVIDIA graphics)

# Universal Blue's Silverblue image. ublue stopped publishing its -nvidia images
# (Nov 2026, ublue-os/main#3075), so the driver is added below with the akmods module.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  # NVIDIA driver (open kernel modules, RTX 20xx / GTX 16xx and newer), signed for Secure Boot.
  # Pulls ghcr.io/ublue-os/akmods-nvidia-open:main-<fedora> and sets the NVIDIA kernel args.
  # For older GPUs (GTX 9xx / 10xx) use: nvidia-driver: nvidia
  - type: akmods
    nvidia-driver: nvidia-open
    install: [] # required by the schema; no extra kernel modules needed

  - from-file: gnome-modules.yml
  - from-file: shared-modules.yml # keep last: ends with signing and the initramfs
