# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# GNOME, for laptops WITH NVIDIA graphics (incl. hybrid Intel/AMD + NVIDIA)
# Published to ghcr.io/rubenvangastel/gnome-nvidia
name: gnome-nvidia
description: My GNOME image (NVIDIA graphics)

# Universal Blue image with NVIDIA drivers preinstalled and signed for Secure Boot.
# Uses the open kernel modules (RTX 20xx / GTX 16xx and newer).
# For older GPUs (GTX 10xx and earlier) use: ghcr.io/ublue-os/silverblue-nvidia-lts
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: latest

modules:
  - from-file: gnome-modules.yml
  - from-file: shared-modules.yml # keep last: ends with signing and the initramfs
