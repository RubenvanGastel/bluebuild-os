# Gravity theme for the niri app launcher (Mod+D).
# Override per user in ~/.config/fuzzel/fuzzel.ini.
[main]
font=sans-serif:size=13
prompt="❖  "
icon-theme=MoreWaita
width=36
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=10
layer=overlay

# The shell's default colours (dark); they don't follow its accent or light mode.
[colors]
background=0c0e13ee
text=e1e2e9ff
prompt=a7c8ffff
placeholder=c4c6cfff
input=e1e2e9ff
match=a7c8ffff
selection=282a2fff
selection-text=e1e2e9ff
selection-match=a7c8ffff
border=a7c8ff66

[border]
width=1
radius=18
