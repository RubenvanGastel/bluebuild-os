# Gravity theme for the niri app launcher (Mod+D).
# Override per user in ~/.config/fuzzel/fuzzel.ini.
[main]
font=sans-serif:size=13
prompt="❖  "
icon-theme=MoreWaita
width=36
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=10
layer=overlay

[colors]
background=0d0920ee
text=efe8ffff
prompt=f4c66dff
placeholder=a99cccff
input=f7ecd6ff
match=f4c66dff
selection=3a2868ff
selection-text=f7ecd6ff
selection-match=f4c66dff
border=f4c66d66

[border]
width=1
radius=18
