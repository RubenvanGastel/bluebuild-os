# Retry the first-boot Flatpak install when it fails (no network yet, the laptop
# suspended mid-download, Flathub hiccup). Waits 1 minute, backing off to 15 minutes.
# Apps that are already installed are skipped, so a retry only fetches what's missing.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=1min
RestartSteps=4
RestartMaxDelaySec=15min
