# As niri.service does on the niri images: start the XDG autostart programs (GNOME
# Keyring, ...) and the file indexer with the session. The indexer's autostart entry is
# skipped under systemd, so otherwise it only starts once Nautilus is opened.
[Unit]
Wants=xdg-desktop-autostart.target localsearch-3.service
Before=xdg-desktop-autostart.target
