name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # build at 06:00 UTC every day (after ublue images)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"
  pull_request:
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe-gnome.yml          # GNOME, Intel/AMD
          - recipe-gnome-nvidia.yml   # GNOME, NVIDIA
          - recipe-gravity.yml        # niri + Gravity shell, Intel/AMD
          - recipe-gravity-nvidia.yml # niri + Gravity shell, NVIDIA
          - recipe-niri.yml           # niri + Dux Shell, Intel/AMD
          - recipe-niri-nvidia.yml    # niri + Dux Shell, NVIDIA
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
